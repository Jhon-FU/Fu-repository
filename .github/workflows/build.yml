name: Windows build and tests
on:
  push:
    branches:
      - '**'
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check bundled dictionaries
        run: python scripts/verify_wordbanks.py
      - name: Regression and community tests
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Publish Windows executable
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: WordMachineCommunity-win-x64
          path: artifacts/release
